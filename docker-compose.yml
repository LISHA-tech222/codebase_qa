services:

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped

    environment:
      POSTGRES_USER: codeqa
      POSTGRES_PASSWORD: codeqa_password
      POSTGRES_DB: codeqa

    ports:
      - "5435:5432"

    volumes:
      - codeqa_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeqa -d codeqa"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://codeqa:codeqa_password@db:5432/codeqa

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data

volumes:
  codeqa_pgdata:
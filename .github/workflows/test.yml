name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: codeqa_user
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: codeqa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://codeqa_user:testpassword@localhost:5432/codeqa_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=testpassword psql -h localhost -U codeqa_user -d codeqa_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run Alembic migration
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v